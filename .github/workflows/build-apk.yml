name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Optional: Google Sign-In. Add repo secret GOOGLE_SERVICES_JSON (full file content).
      - name: Add google-services.json (optional)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then echo "$GSJ" > app/google-services.json; echo "Firebase enabled"; else echo "Firebase not configured - local-only mode"; fi

      # Fixed signing key so in-app updates install over the previous version.
      - name: Decode keystore (optional)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > $RUNNER_TEMP/release.jks; echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV; else echo "::warning::No KEYSTORE_BASE64 secret - APK signed with a temporary debug key"; fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK + SHA-256
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/AbgMieVPN-v${VERSION_NAME}.apk"
          cd out && sha256sum "AbgMieVPN-v${VERSION_NAME}.apk" > "AbgMieVPN-v${VERSION_NAME}.apk.sha256" && cat *.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: AbgMieVPN-apk
          path: out/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: AbgMieVPN v${{ env.VERSION_NAME }}
          body: |
            ${{ github.event.head_commit.message }}

            Install: download AbgMieVPN-v${{ env.VERSION_NAME }}.apk below.
            SHA-256 checksum is attached and verified automatically by the in-app updater.
          files: out/*
          make_latest: true
